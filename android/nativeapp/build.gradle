plugins {
    id 'com.android.application'
}

android {
    namespace 'app.zeabur.ligongdazi.nativeapp'
    compileSdkVersion 35

    defaultConfig {
        // Separate from the existing TWA so testers do not lose its Web Push support.
        applicationId 'app.zeabur.ligongdazi.nativeapp'
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 2
        versionName "1.1-beta"
    }

    sourceSets.main.res.srcDirs += ['../app/src/main/res']

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
