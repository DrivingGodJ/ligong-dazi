<title>欢迎来到理工搭子局</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{position:fixed;inset:0;contain:paint}
body{--bg:#faf7ff;--ink:#793dce;--soft:#e5d4fb;--wave:#cfa8f4;background:var(--bg);font-family:system-ui,sans-serif;color:var(--ink);display:grid;place-items:center}
body:before,body:after{content:"";position:absolute;width:65vmin;height:65vmin;border-radius:50%;background:var(--soft);z-index:0}
body:before{left:-30vmin;top:-26vmin}body:after{right:-35vmin;top:-32vmin}
.composition{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding: max(24px,env(safe-area-inset-top)) 20px max(90px,env(safe-area-inset-bottom));gap:clamp(4px,2vh,24px)}
h1{font-size:clamp(30px,8vmin,64px);line-height:1.1;margin:0;font-weight:850;letter-spacing:-.03em}
.flower{display:block;width:min(90vw,460px);height:min(58vh,560px);min-height:0;overflow:visible}
.waves{position:absolute;inset:auto 0 0;width:100%;height:20%;color:var(--wave)}
.line{position:absolute;inset:0;width:100%;height:100%;stroke:#bd92f0;fill:none;stroke-width:3;opacity:.65}
@media(orientation:landscape){.composition{flex-direction:row;gap:4vw;padding:18px 5vw 70px}.flower{width:min(48vw,480px);height:75vh}h1{font-size:clamp(28px,8vh,64px)}}
@media(prefers-color-scheme:dark){body{--bg:#17121f;--ink:#d3b0ff;--soft:#2d203e;--wave:#50336b}.line{stroke:#79549f}.flower{filter:brightness(.92)}}
</style></head><body>
