[project]
name = "ligong-dazi-backend"
version = "0.1.0"
description = "理工搭子局 AI 搭子执行 Agent 后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.121,<1",
  "httpx>=0.28,<1",
  "pyjwt>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
